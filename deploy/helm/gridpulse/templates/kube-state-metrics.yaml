{{- if .Values.kubeStateMetrics.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-kube-state-metrics
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-kube-state-metrics}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-kube-state-metrics}
    spec:
      serviceAccountName: {{ .Release.Name }}-kube-state-metrics
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: metrics
          image: {{ .Values.kubeStateMetrics.image }}
          args: ["--resources=pods", "--namespaces={{ .Release.Namespace }}"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /livez, port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
spec:
  type: NodePort
  selector: {app: {{ .Release.Name }}-kube-state-metrics}
  ports: [{port: 8080, targetPort: http, nodePort: {{ .Values.kubeStateMetrics.nodePort }}}]
{{- end }}
