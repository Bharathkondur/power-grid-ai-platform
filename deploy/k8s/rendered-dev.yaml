# Source: gridpulse/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridpulse-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: gridpulse-api}
  template:
    metadata:
      labels: {app: gridpulse-api}
      annotations:
        checksum/config: 11f4da94b8441c72f34a201727db2e13eb31ec50f733cf2b1ee69195e4315b6e
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: "gridpulse-ai:0.1.0"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: gridpulse-config}
            - secretRef: {name: gridpulse-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: runtime, mountPath: /app/runtime}
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/gridpulse}
      volumes:
        - {name: runtime, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: home, emptyDir: {}}
