# Source: gridpulse/templates/kube-state-metrics.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridpulse-kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels: {app: gridpulse-kube-state-metrics}
  template:
    metadata:
      labels: {app: gridpulse-kube-state-metrics}
    spec:
      serviceAccountName: gridpulse-kube-state-metrics
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          args: ["--resources=pods", "--namespaces=gridpulse"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /livez, port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
