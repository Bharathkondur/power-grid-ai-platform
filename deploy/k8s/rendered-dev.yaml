apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridpulse-ingestion
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gridpulse-ingestion}
  template:
    metadata:
      labels: {app: gridpulse-ingestion}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: ingestion
          image: "gridpulse-ai:0.1.0"
          imagePullPolicy: IfNotPresent
          command: [gridpulse, mqtt, subscribe]
          envFrom:
            - configMapRef: {name: gridpulse-config}
            - secretRef: {name: gridpulse-secrets}
          env:
            - name: GRIDPULSE_MQTT_CLIENT_ID
              value: gridpulse-k8s-ingestion
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts: [{name: runtime, mountPath: /app/runtime}]
      volumes: [{name: runtime, emptyDir: {}}]
