# Source: gridpulse/templates/cronjobs.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gridpulse-monitor
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
          containers:
            - name: monitor
              image: "gridpulse-ai:0.1.0"
              command: [gridpulse, monitor]
              envFrom:
                - configMapRef: {name: gridpulse-config}
                - secretRef: {name: gridpulse-secrets}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              resources:
                requests: {cpu: 200m, memory: 512Mi}
                limits: {cpu: "2", memory: 2Gi}
              volumeMounts: [{name: runtime, mountPath: /app/runtime}]
          volumes: [{name: runtime, emptyDir: {}}]
