global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: gridpulse-api
    static_configs:
      - targets: [api:8000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: gridpulse-kubernetes
    static_configs:
      - targets: [host.docker.internal:18000]
  - job_name: kube-state-metrics
    static_configs:
      - targets: [host.docker.internal:18080]
