[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gridpulse-ai"
version = "0.1.0"
description = "Personal portfolio: hourly German electricity demand forecasting and ML operations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "pandas>=2.3,<3",
  "numpy==2.2.6",
  "xgboost==3.0.5",
  "scikit-learn==1.7.2",
  "mlflow>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "holidays>=0.78,<1",
  "prometheus-client>=0.22,<1",
  "paho-mqtt>=2.1,<3",
  "boto3>=1.40,<2",
  "entsoe-py>=0.6,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pip-audit>=2.9,<3", "pyyaml>=6,<7"]

[project.scripts]
gridpulse = "gridpulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real tracking and model integration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

